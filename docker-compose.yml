services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onehms
      POSTGRES_USER: onehms
      POSTGRES_PASSWORD: onehms
    volumes:
      - onehms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehms"]
      interval: 5s
      timeout: 5s
      retries: 10

  hms:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://onehms:onehms@db:5432/onehms
      JWT_SECRET: replace-this-with-a-long-random-secret-at-least-32-characters
      CORS_ORIGINS: http://localhost:8082
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

volumes:
  onehms_pg:
